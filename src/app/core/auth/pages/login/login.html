<div class="login-page">

    @if (showLoginButton) {
    <button matButton="filled" (click)="openForm()">Login</button>
    }

    @if (showForm) {
    <div class="login-form-container">
        <form (ngSubmit)="login()">
            <mat-card class="login-form-card" appearance="outlined">
                <mat-card-header>
                    <mat-card-title>Login</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <mat-form-field>
                        <mat-label>Enter your Email</mat-label>
                        <input matInput>
                    </mat-form-field>
                    <mat-form-field>
                        <mat-label>Enter your password</mat-label>
                        <input matInput [type]="hide() ? 'password' : 'text'" />
                        <button type="button" matIconButton matSuffix (click)="clickEvent($event)"
                            [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide()">
                            <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                        </button>
                    </mat-form-field>
                </mat-card-content>
                <mat-card-actions>
                    <button type="button" matButton (click)="closeForm()">Cancel</button>
                    <button type="button" matButton (click)="login()">Login</button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
    }

</div>
